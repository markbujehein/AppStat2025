[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appstat"
version = "0.1.0"
description = "Helper functions for the Applied Statistics 2025 course exercises"
requires-python = ">=3.15"
dependencies = ["numpy", "scipy", "iminuit", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/appstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
