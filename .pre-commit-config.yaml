repos:
  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout
        entry: pixi run nbstripout
        language: system
        types: [jupyter]
      - id: ruff-check
        name: ruff check
        entry: pixi run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: pixi run ruff format --check
        language: system
        types: [python]
