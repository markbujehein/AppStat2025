[workspace]
authors = ["Mark Sørensen <191927387+markbujehein@users.noreply.github.com>"]
channels = ['conda-forge']
name = "appstat25"
platforms = ['linux-64']
version = "0.1.0"

[dependencies]
python = "3.13.*"
numpy = "*"
matplotlib = "*"
scipy = "*"
pandas = "*"
sympy = "*"
iminuit = "*"
notebook = "*"
ipython = "*"
ipywidgets = "*"
scikit-learn = ">=1.9.1,<2"
seaborn = ">=0.13.2,<0.14"
tqdm = ">=4.70.1,<5"
ty = ">=0.0.107,<0.0.108"
ruff = ">=0.17.6,<0.18"
pytest = "*"
pre-commit = "*"
nbstripout = "*"
quarto = ">=1.11.9,<2"

[pypi-dependencies]
appstat = { path = ".", editable = true }

[tasks]
lint = "ruff check src tests"
fmt = "ruff format --check src tests"
test = "pytest"
check = { depends-on = ["lint", "fmt", "test"] }
hooks = "pre-commit install"
docs = "quarto render"
preview = "quarto preview"
