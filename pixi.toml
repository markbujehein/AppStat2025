[workspace]
authors = ["Mark Sørensen <191927387+markbujehein@users.noreply.github.com>"]
channels = ['conda-forge']
name = "appstat25"
platforms = ['linux-64']
version = "0.1.0"

[dependencies]
python = ">=3.15.2,<3.16"
numpy = ">=2.5.5,<3"
matplotlib = ">=3.11.2,<4"
scipy = ">=1.18.1,<2"
pandas = ">=3.1.1,<4"
sympy = ">=1.14.0,<2"
iminuit = ">=2.33.0,<3"
notebook = ">=7.6.5,<8"
ipython = ">=9.18.1,<10"
ipywidgets = ">=8.1.9,<9"
scikit-learn = ">=1.9.1,<2"
seaborn = ">=0.13.2,<0.14"
tqdm = ">=4.70.1,<5"
ty = ">=0.0.107,<0.0.108"
ruff = ">=0.17.6,<0.18"
pytest = ">=9.2.0,<10"
pre-commit = ">=4.7.0,<5"
nbstripout = ">=0.9.2,<0.10"
quarto = ">=1.11.9,<2"

[pypi-dependencies]
appstat = { path = ".", editable = true }
marimo = { version = ">=0.25.2, <0.26", extras = ["recommended"] }

[tasks]
lint = "ruff check src tests scripts"
lint-md = "python scripts/lint_notebooks.py"
fix-md = "python scripts/lint_notebooks.py --fix"
fmt = "ruff format --check src tests scripts"
test = "pytest"
check = { depends-on = ["lint", "lint-md", "fmt", "test"] }
hooks = "pre-commit install"
strip = "nbstripout work/*/*.ipynb work/*/*/*.ipynb"
clean-site = "rm -rf _site .quarto site_libs index.html index-listing.json"
clean-api = "rm -rf reference _quartodoc.yml objects.json"
clean-caches = "rm -rf .pytest_cache .ruff_cache scripts/__pycache__ src/appstat/__pycache__ tests/__pycache__"
# leftovers of an interrupted quarto render, and marimo caches
clean-work = "rm -rf work/*/*_mark.html work/*/*_mark_files work/*/*/*_mark.html work/*/*/*_mark_files work/*/*/__marimo__"
clean = { depends-on = ["clean-site", "clean-api", "clean-caches", "clean-work"] }
docs = { cmd = "quarto render && python scripts/build_demos.py", depends-on = [{ task = "api", environment = "docs" }] }
preview = { cmd = "quarto preview --render none", depends-on = ["docs"] }

# quartodoc needs griffe 1.x, but marimo pulls in griffe 2 from PyPI: keep it in its own environment.
# Run it with `pixi run -e docs api`.
[feature.docs.dependencies]
python = ">=3.15.2,<3.16"
quartodoc = ">=0.11.1,<0.12"
griffe = "<2"

[feature.docs.tasks]
api = "python scripts/api_config.py && quartodoc build --config _quartodoc.yml"

[environments]
docs = { features = ["docs"], no-default-feature = true }
