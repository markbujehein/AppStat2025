project:
  type: website
  render:
    - reference/*.qmd

# Only the API reference is built by Quarto. The landing page and the demos are written by
# scripts/build_demos.py. Both use site/header.html, so the navigation is the same everywhere.
website:
  title: Applied Statistics 2025
  repo-url: https://github.com/markbujehein/AppStat2025
  favicon: favicon.svg

format:
  html:
    theme: theme.scss
    css: site/site.css
    include-before-body: site/header.html
    toc: false
