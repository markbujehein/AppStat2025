project:
  type: website
  render:
    - index.qmd
    - reference/*.qmd
    - work/*/*/*.ipynb

website:
  title: Applied Statistics 2025
  repo-url: https://github.com/markbujehein/AppStat2025

# Notebooks are stored without outputs (nbstripout), so Quarto runs them.
# error: true keeps a failing notebook on the site, with the traceback shown.
execute:
  enabled: true
  error: true

# API reference for src/appstat, generated from the numpydoc docstrings (pixi run api).
quartodoc:
  package: appstat
  source_dir: src
  dir: reference
  parser: numpy
  sections:
    - title: appstat
      desc: Helper functions for the exercises.
      contents:
        - stats
        - fitting
        - plotting
