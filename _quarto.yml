project:
  type: website
  render:
    - index.qmd
    - reference/*.qmd
    - work/Week0/*.ipynb

website:
  title: Applied Statistics 2025
  repo-url: https://github.com/markbujehein/AppStat2025
  favicon: favicon.svg
  navbar:
    background: "#1d1538"
    left:
      - href: index.qmd
        text: Notebooks
      - href: reference/index.qmd
        text: API reference
    right:
      - icon: github
        href: https://github.com/markbujehein/AppStat2025
        aria-label: GitHub

format:
  html:
    theme: theme.scss
    toc: false

# Notebooks are stored without outputs (nbstripout), so Quarto runs them.
# error: true keeps a failing notebook on the site, with the traceback shown.
execute:
  enabled: true
  error: true
  freeze: auto  # re-run a notebook only when its file changed; results live in _freeze/

# API reference for src/appstat, generated from the numpydoc docstrings (pixi run api).
quartodoc:
  package: appstat
  source_dir: src
  dir: reference
  parser: numpy
  sections:
    - title: appstat
      desc: Helper functions for the exercises.
      contents:
        - stats
        - fitting
        - plotting
